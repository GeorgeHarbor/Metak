plugins {
    id 'com.android.application'
}

android {
    namespace 'app.metak'
    compileSdk 34

    defaultConfig {
        applicationId 'app.metak'
        minSdk 26 // Watch Next lives in TvContract from API 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
            // shortcut: release is signed with the debug key so it installs as-is, add a real keystore before publishing
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
