name: Release

# Builds a signed APK on every push to main and publishes it to a rolling "latest" GitHub Release.
# Reuses the same signing secrets as the SmartTube repo so updates install over one another.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 50 # enough history for the changelog

      - name: Set up JDK 17
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Configure Build Signing
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          ALIAS: ${{ secrets.ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          # Never ship unsigned: an update only installs over a build signed with the same key.
          if [ -z "$SIGNING_KEY" ]; then
            echo "::error::SIGNING_KEY secret is missing"
            exit 1
          fi
          echo "$SIGNING_KEY" | base64 --decode > "$RUNNER_TEMP/key.jks"
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$RUNNER_TEMP/key.jks" "$KEY_STORE_PASSWORD" "$ALIAS" "$KEY_PASSWORD" > keystore.properties

      - name: Set Version
        id: version
        run: |
          # versionCode climbs with every run so newer builds always outrank older ones.
          CODE=${{ github.run_number }}
          # versionName comes from the pushed tag (v1.2.3 -> 1.2.3); manual dispatch falls back to build.gradle + run number.
          if [ "${{ github.ref_type }}" = "tag" ]; then
            NAME="${GITHUB_REF_NAME#v}"
          else
            BASE=$(grep -m1 "versionName" app/build.gradle | awk -F"'" '{print $2}')
            NAME="$BASE.$CODE"
          fi
          sed -i "s/versionCode [0-9]\+/versionCode $CODE/" app/build.gradle
          sed -i "s/versionName '.*'/versionName '$NAME'/" app/build.gradle
          echo "Releasing $NAME ($CODE)"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"

      - name: Build with Gradle
        run: |
          chmod +x gradlew
          ./gradlew clean assembleRelease

      - name: Prepare Release Assets
        env:
          NAME: ${{ steps.version.outputs.name }}
        run: |
          mkdir dist
          cp app/build/outputs/apk/release/app-release.apk dist/metak.apk
          cp app/build/outputs/apk/release/app-release.apk "dist/Metak_${NAME}.apk"
          # The updater polls GitHub's latest-release redirect, which always resolves to the newest release.
          BASE="https://github.com/$GITHUB_REPOSITORY/releases/latest/download"
          jq -n --argjson code "${{ steps.version.outputs.code }}" --arg name "$NAME" --arg apk "$BASE/metak.apk" \
            '{versionCode: $code, versionName: $name, apk: $apk}' > dist/metak.json
          cat dist/metak.json

      - name: Publish Release
        env:
          NAME: ${{ steps.version.outputs.name }}
        run: |
          NOTES=$(git log -n 10 --no-merges --pretty=format:'- %s')

          # The real release for this version, kept forever and flagged as the repo's latest.
          gh release create "v$NAME" dist/metak.apk dist/metak.json "dist/Metak_${NAME}.apk" \
            --title "Metak $NAME" --notes "$NOTES" --latest

          # Legacy rolling release so apps built before the URL change keep seeing updates.
          # Only the two stable files live here, so nothing piles up.
          git tag -f latest
          git push -f origin refs/tags/latest
          if gh release view latest > /dev/null 2>&1; then
            gh release upload latest dist/metak.apk dist/metak.json --clobber
          else
            gh release create latest dist/metak.apk dist/metak.json \
              --title "Metak (rolling)" --notes "Pointer for older builds; see the versioned releases." --latest=false
          fi
