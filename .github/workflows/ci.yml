name: Build Debug APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up JDK 17
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Update Version Name
        id: get_version
        run: |
          # Mark CI builds as nightly so they don't look like a real release.
          sed -i "s/versionName '\(.*\)'/versionName '\1-nightly-${{ github.run_number }}'/" app/build.gradle
          echo "VERSION_NAME=$(grep -m1 "versionName" app/build.gradle | awk -F"'" '{print $2}')" >> $GITHUB_OUTPUT

      - name: Grant Gradle permissions
        run: chmod +x gradlew

      - name: Lint
        run: ./gradlew lintDebug

      - name: Upload Lint Report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: lint-report
          path: '**/build/reports/lint-results-*.html'
          if-no-files-found: warn

      - name: Build Debug APK
        run: ./gradlew clean assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Metak_${{ steps.get_version.outputs.VERSION_NAME }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
